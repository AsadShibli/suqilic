# Render's free tier sleeps after 15 idle minutes and takes ~a minute to wake.
# Ping the API and storefront every 10 minutes so visitors land on a warm server.
# (GitHub may delay scheduled runs; an external uptime monitor on /healthz is a sturdier option.)
name: Keep warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health check
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 https://suqilic-api.onrender.com/healthz
      - name: Ping storefront
        run: curl --fail --silent --show-error --output /dev/null --max-time 30 https://suqilic.onrender.com/
