services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suqilic
      POSTGRES_USER: suqilic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suqilic"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://suqilic:${POSTGRES_PASSWORD}@db:5432/suqilic
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_ADMIN_PATH: ${ADMIN_URL_PATH:-suqilic-control}
    ports:
      - "80:80"
    volumes:
      - media:/srv/media:ro
    depends_on:
      - backend

volumes:
  pgdata:
  media:
